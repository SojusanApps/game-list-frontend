# Configuration file for `prek`, a git hook framework written in Rust.
# See https://prek.j178.dev for more information.
#:schema https://www.schemastore.org/prek.json

# openapi.json is a verbatim copy of the backend's file (see `just dev`), and
# src/client/** + src/routeTree.gen.ts are regenerated by codegen/the router
# plugin — none of these are hand-authored, so hygiene hooks would just churn
# on them every time they're regenerated.
exclude = '(?x)^(openapi\.json|src/client/.*|src/routeTree\.gen\.ts)$'

[[repos]]
hooks = [
  { id = "trailing-whitespace" },
  { id = "end-of-file-fixer" },
  { id = "check-yaml" },
  { id = "check-json" },
  { id = "mixed-line-ending", args = [
    "--fix=lf",
  ] },
]
repo = "https://github.com/pre-commit/pre-commit-hooks"
rev = "v6.0.0"

[[repos]]
hooks = [
  { id = "oxfmt", name = "oxfmt", entry = "pnpm format", language = "system", pass_filenames = false, always_run = true, require_serial = true },
  { id = "oxlint", name = "oxlint", entry = "pnpm lint", language = "system", pass_filenames = false, always_run = true, require_serial = true },
  { id = "typecheck", name = "typecheck", entry = "pnpm typecheck", language = "system", pass_filenames = false, always_run = true, require_serial = true },
  { id = "test", name = "test with coverage", entry = "pnpm coverage", language = "system", pass_filenames = false, always_run = true, require_serial = true },
]
repo = "local"
